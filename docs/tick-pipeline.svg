<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1312" width="1000" height="1312" role="img" aria-label="Robotic Arm Drawing System, the differential tick pipeline for one MoveToXY call, worked for the point (4.0, 12.0) as a hypothetical first move. RhinoMath::getAngpair solves the two-link inverse kinematics with ArmA = ArmB = 9.0: theta2 = acos(-2 / 162) = 90.71 degrees and theta1 = 45.35 + 71.57 = 116.92 degrees. MoveToXY truncates each angle divided by 0.12 to absolute clicks: int(974.32) = 974 for motor E, the shoulder, and int(755.89) = 755 for motor D, the elbow. Call 1, RhrinoSpecific::MotoMoveServo('E', 974), reads the remembered TickAng1 = 750 (the seed), computes diff = 750 - 974 = -224 (old minus new), stores TickAng1 = 974, sends Distance = -224 unchanged and stores EmotorDistance = -224, which line 28 copies to EmotorDistance2 on every call. Call 2, MotoMoveServo('D', 755), computes diff = 750 - 755 = -5, stores TickAng2 = 755, and sends Distance = -5 - (-224) = +219: the elbow's command corrected by the shoulder's move. Each call chunks its own distance into 50-click commands plus a remainder that is always written, with '+' only when the distance is above zero: E-50 four times and E-24 as writes 1 to 5, all sent before call 2 starts, then D+50 four times and D+19 as writes 6 to 10. Every write is Sleep(120), the command bytes through sendArray (E, minus, 5, 0 = 0x45 0x2D 0x35 0x30), CR and LF through two sendChar calls, then Sleep(120), on COM1 at 9600 baud, 7 data bits, even parity, 2 stop bits. The whole MoveToXY is 10 writes and 60 bytes, about 69 ms on the line, against 2.4 s of Sleep; if COM1 fails to open the writes do nothing but the sleeps still run. In test5.txt the pen actually reaches (4, 12) at the end of line 9's interpolation, so that final snap sends only E-0 and D+1.">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#1f2328;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sub{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .note{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .glbl{fill:#59636e;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .elbl{fill:#59636e;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{stroke:#818b98;stroke-width:1.6;fill:none}
    .edge-dash{stroke:#818b98;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .arrow{fill:#818b98}
    .group{fill:none;stroke:#d1d9e0;stroke-width:1.2;stroke-dasharray:4 4}
    .b-blue{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.5}
    .b-green{fill:#dafbe1;stroke:#4ac26b;stroke-width:1.5}
    .b-purple{fill:#fbefff;stroke:#c297ff;stroke-width:1.5}
    .b-orange{fill:#fff1e5;stroke:#fb8f44;stroke-width:1.5}
    .b-gray{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}
    .b-red{fill:#ffebe9;stroke:#ff8182;stroke-width:1.5}
    .b-planned{fill:none;stroke:#818b98;stroke-width:1.4;stroke-dasharray:5 4}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .wire{stroke:#59636e;stroke-width:1.4;fill:none}
    .dot{fill:#59636e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .title,.lbl{fill:#e6edf3}
      .sub,.note,.glbl,.elbl{fill:#9198a1}
      .edge,.edge-dash{stroke:#9198a1}
      .arrow{fill:#9198a1}
      .group{stroke:#3d444d}
      .b-blue{fill:#0c2d6b;stroke:#4493f8}
      .b-green{fill:#0f3b1e;stroke:#3fb950}
      .b-purple{fill:#2e1a4f;stroke:#ab7df8}
      .b-orange{fill:#3d1f0a;stroke:#f0883e}
      .b-gray{fill:#151b23;stroke:#3d444d}
      .b-red{fill:#3c1618;stroke:#f85149}
      .b-planned{stroke:#9198a1}
      .wire{stroke:#9198a1}
      .dot{fill:#9198a1}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="1312" rx="12"/>
  <text class="title" x="32" y="48">Robotic Arm Drawing System — the differential tick pipeline</text>
  <text class="sub" x="32" y="74">One MoveToXY: absolute clicks in, differences out, elbow corrected by shoulder, sent as ±50 chunks + remainder.</text>

  <!-- ============ ABSOLUTE: point -> angles ============ -->
  <rect class="b-blue" x="32" y="96" width="230" height="80" rx="10"/>
  <text class="lbl mono" x="147" y="122" text-anchor="middle">MoveToXY(4.0, 12.0)</text>
  <text class="note" x="147" y="144" text-anchor="middle">one PointXY target</text>
  <text class="note mono" x="147" y="162" text-anchor="middle">MoveToPoint.cpp:4–12</text>

  <line class="edge" x1="262" y1="136" x2="294" y2="136" marker-end="url(#ah)"/>

  <rect class="b-blue" x="296" y="96" width="672" height="80" rx="10"/>
  <text class="lbl" x="316" y="122">RhinoMath::getAngpair — two-link IK, ArmA = ArmB = 9.0, degrees out</text>
  <text class="note mono" x="316" y="144">θ2 = acos((x² + y² − A² − B²) / 2AB) = acos(−2 / 162) = 90.71°</text>
  <text class="note mono" x="316" y="162">θ1 = asin(A·sin θ2 / √(x² + y²)) + atan(y / x) = 45.35° + 71.57° = 116.92°</text>

  <!-- fork into the two calls -->
  <line class="edge" x1="358" y1="176" x2="358" y2="271" marker-end="url(#ah)"/>
  <text class="elbl" x="348" y="200" text-anchor="end">θ1 = 116.92°, then int(θ1 / .12)</text>
  <text class="elbl mono" x="348" y="216" text-anchor="end">RhrinoSpecific::MotoMoveServo('E', 974)</text>
  <line class="edge" x1="854" y1="176" x2="854" y2="271" marker-end="url(#ah)"/>
  <text class="elbl" x="844" y="200" text-anchor="end">θ2 = 90.71°, then int(θ2 / .12)</text>
  <text class="elbl mono" x="844" y="216" text-anchor="end">RhrinoSpecific::MotoMoveServo('D', 755)</text>

  <!-- ============ CALL 1 : motor E ============ -->
  <rect class="group" x="32" y="232" width="440" height="560" rx="12"/>
  <text class="glbl" x="48" y="256">CALL 1 · MOTOR E · SHOULDER</text>

  <!-- r1 -->
  <rect class="b-gray" x="48" y="272" width="196" height="72" rx="10"/>
  <text class="lbl mono" x="146" y="296" text-anchor="middle">TickAng1 = 750</text>
  <text class="note" x="146" y="316" text-anchor="middle">seed, RhrinoSpecific.h:14</text>
  <text class="note" x="146" y="332" text-anchor="middle">then TickAng1 ← 974 (:24)</text>

  <rect class="b-blue" x="260" y="272" width="196" height="72" rx="10"/>
  <text class="lbl mono" x="358" y="296" text-anchor="middle">target = 974</text>
  <text class="note" x="358" y="316" text-anchor="middle">argument, absolute clicks</text>
  <text class="note mono" x="358" y="332" text-anchor="middle">int(974.32) → 974</text>

  <line class="edge" x1="146" y1="344" x2="146" y2="379" marker-end="url(#ah)"/>
  <line class="edge" x1="358" y1="344" x2="358" y2="379" marker-end="url(#ah)"/>

  <!-- r2 -->
  <rect class="b-orange" x="48" y="380" width="408" height="64" rx="10"/>
  <text class="lbl mono" x="252" y="406" text-anchor="middle">diff = 750 − 974 = −224</text>
  <text class="note" x="252" y="428" text-anchor="middle">TickAng1 − target, old minus new (:23)</text>

  <line class="edge" x1="134" y1="444" x2="134" y2="479" marker-end="url(#ah)"/>
  <line class="edge" x1="346" y1="444" x2="346" y2="479" marker-end="url(#ah)"/>

  <!-- r3 -->
  <rect class="b-orange" x="48" y="480" width="172" height="72" rx="10"/>
  <text class="lbl mono" x="134" y="504" text-anchor="middle">Distance = −224</text>
  <text class="note" x="134" y="524" text-anchor="middle">the diff as is (:25)</text>
  <text class="note" x="134" y="540" text-anchor="middle">no correction for E</text>

  <rect class="b-gray" x="236" y="480" width="220" height="72" rx="10"/>
  <text class="lbl mono" x="346" y="504" text-anchor="middle">EmotorDistance = −224</text>
  <text class="note" x="346" y="524" text-anchor="middle">set (:26), then copied (:28) to</text>
  <text class="note mono" x="346" y="540" text-anchor="middle">EmotorDistance2 = −224</text>

  <line class="edge" x1="134" y1="552" x2="134" y2="587" marker-end="url(#ah)"/>

  <!-- r4 -->
  <rect class="b-orange" x="48" y="588" width="408" height="72" rx="10"/>
  <text class="lbl" x="64" y="612">chunk (:46–58): 4 × 50 + 24, sign '-'</text>
  <text class="note mono" x="64" y="632" xml:space="preserve">count  = −224 / 50 = −4 → loop 4 times</text>
  <text class="note mono" x="64" y="648">cntRem = |−224 % 50| = 24 · −224 &gt; 0? no → '-'</text>

  <line class="edge" x1="252" y1="660" x2="252" y2="695" marker-end="url(#ah)"/>

  <!-- r5: the five E writes -->
  <rect class="b-green" x="48" y="696" width="74" height="52" rx="8"/>
  <text class="lbl mono" x="85" y="718" text-anchor="middle">E-50</text>
  <text class="note" x="85" y="738" text-anchor="middle">write 1</text>
  <rect class="b-green" x="131.5" y="696" width="74" height="52" rx="8"/>
  <text class="lbl mono" x="168.5" y="718" text-anchor="middle">E-50</text>
  <text class="note" x="168.5" y="738" text-anchor="middle">write 2</text>
  <rect class="b-green" x="215" y="696" width="74" height="52" rx="8"/>
  <text class="lbl mono" x="252" y="718" text-anchor="middle">E-50</text>
  <text class="note" x="252" y="738" text-anchor="middle">write 3</text>
  <rect class="b-green" x="298.5" y="696" width="74" height="52" rx="8"/>
  <text class="lbl mono" x="335.5" y="718" text-anchor="middle">E-50</text>
  <text class="note" x="335.5" y="738" text-anchor="middle">write 4</text>
  <rect class="b-green" x="382" y="696" width="74" height="52" rx="8"/>
  <text class="lbl mono" x="419" y="718" text-anchor="middle">E-24</text>
  <text class="note" x="419" y="738" text-anchor="middle">write 5</text>
  <text class="note" x="294" y="774" text-anchor="middle">all five are written before call 2 starts</text>

  <!-- coupling: E's differential feeds D's command -->
  <line class="edge" x1="456" y1="516" x2="543" y2="516" marker-end="url(#ah)"/>
  <text class="elbl mono" x="500" y="507" text-anchor="middle">−224</text>

  <!-- ============ CALL 2 : motor D ============ -->
  <rect class="group" x="528" y="232" width="440" height="560" rx="12"/>
  <text class="glbl" x="544" y="256">CALL 2 · MOTOR D · ELBOW</text>

  <!-- r1 -->
  <rect class="b-gray" x="544" y="272" width="196" height="72" rx="10"/>
  <text class="lbl mono" x="642" y="296" text-anchor="middle">TickAng2 = 750</text>
  <text class="note" x="642" y="316" text-anchor="middle">seed, RhrinoSpecific.h:15</text>
  <text class="note" x="642" y="332" text-anchor="middle">then TickAng2 ← 755 (:34)</text>

  <rect class="b-blue" x="756" y="272" width="196" height="72" rx="10"/>
  <text class="lbl mono" x="854" y="296" text-anchor="middle">target = 755</text>
  <text class="note" x="854" y="316" text-anchor="middle">argument, absolute clicks</text>
  <text class="note mono" x="854" y="332" text-anchor="middle">int(755.89) → 755</text>

  <line class="edge" x1="642" y1="344" x2="642" y2="379" marker-end="url(#ah)"/>
  <line class="edge" x1="854" y1="344" x2="854" y2="379" marker-end="url(#ah)"/>

  <!-- r2 -->
  <rect class="b-purple" x="544" y="380" width="408" height="64" rx="10"/>
  <text class="lbl mono" x="748" y="406" text-anchor="middle">diff = 750 − 755 = −5</text>
  <text class="note" x="748" y="428" text-anchor="middle">TickAng2 − target, old minus new (:33)</text>

  <line class="edge" x1="748" y1="444" x2="748" y2="479" marker-end="url(#ah)"/>

  <!-- r3: the correction -->
  <rect class="b-red" x="544" y="480" width="408" height="72" rx="10"/>
  <text class="lbl mono" x="748" y="504" text-anchor="middle">Distance = −5 − (−224) = +219</text>
  <text class="note mono" x="748" y="524" text-anchor="middle">diff − EmotorDistance2 (:35–36)</text>
  <text class="note" x="748" y="540" text-anchor="middle">the elbow's command corrected by the shoulder's move</text>

  <line class="edge" x1="748" y1="552" x2="748" y2="587" marker-end="url(#ah)"/>

  <!-- r4 -->
  <rect class="b-purple" x="544" y="588" width="408" height="72" rx="10"/>
  <text class="lbl" x="560" y="612">chunk (:46–58): 4 × 50 + 19, sign '+'</text>
  <text class="note mono" x="560" y="632" xml:space="preserve">count  = 219 / 50 = 4 → loop 4 times</text>
  <text class="note mono" x="560" y="648">cntRem = |219 % 50| = 19 · 219 &gt; 0? yes → '+'</text>

  <line class="edge" x1="748" y1="660" x2="748" y2="695" marker-end="url(#ah)"/>

  <!-- r5: the five D writes -->
  <rect class="b-green" x="544" y="696" width="74" height="52" rx="8"/>
  <text class="lbl mono" x="581" y="718" text-anchor="middle">D+50</text>
  <text class="note" x="581" y="738" text-anchor="middle">write 6</text>
  <rect class="b-green" x="627.5" y="696" width="74" height="52" rx="8"/>
  <text class="lbl mono" x="664.5" y="718" text-anchor="middle">D+50</text>
  <text class="note" x="664.5" y="738" text-anchor="middle">write 7</text>
  <rect class="b-green" x="711" y="696" width="74" height="52" rx="8"/>
  <text class="lbl mono" x="748" y="718" text-anchor="middle">D+50</text>
  <text class="note" x="748" y="738" text-anchor="middle">write 8</text>
  <rect class="b-green" x="794.5" y="696" width="74" height="52" rx="8"/>
  <text class="lbl mono" x="831.5" y="718" text-anchor="middle">D+50</text>
  <text class="note" x="831.5" y="738" text-anchor="middle">write 9</text>
  <rect class="b-green" x="878" y="696" width="74" height="52" rx="8"/>
  <text class="lbl mono" x="915" y="718" text-anchor="middle">D+19</text>
  <text class="note" x="915" y="738" text-anchor="middle">write 10</text>
  <text class="note" x="748" y="774" text-anchor="middle">then MoveToXY returns</text>

  <!-- ============ ONE WRITE, ZOOMED ============ -->
  <line class="edge" x1="85" y1="748" x2="85" y2="827" marker-end="url(#ah)"/>
  <text class="elbl" x="95" y="814">write 1, zoomed</text>

  <rect class="group" x="32" y="828" width="936" height="276" rx="12"/>
  <text class="glbl" x="48" y="852">ONE WRITE ON COM1 — "E-50"</text>
  <text class="elbl mono" x="952" y="852" text-anchor="end">RhrinoSpecific.cpp:64–66 · tserial.cpp:211–224</text>

  <!-- brackets over the bytes -->
  <text class="elbl" x="410" y="882" text-anchor="middle">sendArray: the 4 command characters</text>
  <path class="wire" d="M236,896 V890 H584.8 V896"/>
  <text class="elbl" x="679.2" y="882" text-anchor="middle">sendChar × 2</text>
  <path class="wire" d="M594.4,896 V890 H764 V896"/>

  <!-- the strip -->
  <rect class="b-planned" x="48" y="904" width="172" height="56" rx="10"/>
  <text class="lbl mono" x="134" y="928" text-anchor="middle">Sleep(120)</text>
  <text class="note" x="134" y="947" text-anchor="middle">nothing sent (:64)</text>

  <rect class="b-green" x="236" y="904" width="80" height="56" rx="8"/>
  <text class="lbl mono" x="276" y="928" text-anchor="middle">'E'</text>
  <text class="note mono" x="276" y="947" text-anchor="middle">0x45</text>
  <rect class="b-green" x="325.6" y="904" width="80" height="56" rx="8"/>
  <text class="lbl mono" x="365.6" y="928" text-anchor="middle">'-'</text>
  <text class="note mono" x="365.6" y="947" text-anchor="middle">0x2D</text>
  <rect class="b-green" x="415.2" y="904" width="80" height="56" rx="8"/>
  <text class="lbl mono" x="455.2" y="928" text-anchor="middle">'5'</text>
  <text class="note mono" x="455.2" y="947" text-anchor="middle">0x35</text>
  <rect class="b-green" x="504.8" y="904" width="80" height="56" rx="8"/>
  <text class="lbl mono" x="544.8" y="928" text-anchor="middle">'0'</text>
  <text class="note mono" x="544.8" y="947" text-anchor="middle">0x30</text>
  <rect class="b-green" x="594.4" y="904" width="80" height="56" rx="8"/>
  <text class="lbl mono" x="634.4" y="928" text-anchor="middle">CR</text>
  <text class="note mono" x="634.4" y="947" text-anchor="middle">0x0D</text>
  <rect class="b-green" x="684" y="904" width="80" height="56" rx="8"/>
  <text class="lbl mono" x="724" y="928" text-anchor="middle">LF</text>
  <text class="note mono" x="724" y="947" text-anchor="middle">0x0A</text>

  <rect class="b-planned" x="780" y="904" width="172" height="56" rx="10"/>
  <text class="lbl mono" x="866" y="928" text-anchor="middle">Sleep(120)</text>
  <text class="note" x="866" y="947" text-anchor="middle">nothing sent (:66)</text>

  <!-- time axis -->
  <line class="wire" x1="48" y1="976" x2="950" y2="976" marker-end="url(#ah)"/>
  <line class="wire" x1="228" y1="971" x2="228" y2="981"/>
  <line class="wire" x1="772" y1="971" x2="772" y2="981"/>
  <text class="elbl" x="134" y="994" text-anchor="middle">120 ms</text>
  <text class="elbl" x="500" y="994" text-anchor="middle">6 bytes ≈ 6.9 ms on the line (axis not to scale)</text>
  <text class="elbl" x="866" y="994" text-anchor="middle">120 ms</text>

  <text class="note" x="48" y="1024">Every write has this shape, loop (:64–66) or remainder (:76–78): Sleep(120), command + CR LF, Sleep(120).</text>
  <text class="note" x="48" y="1044">COM1, 9600 baud, 7 data bits, even parity, 2 stop bits (RhrinoSpecific.h:20–21, tserial.cpp:69–89); with the UART start bit, 11 bits a byte.</text>
  <text class="note" x="48" y="1064">This MoveToXY: 10 writes, 60 bytes, ≈ 69 ms on the line, against 20 × Sleep(120) = 2.4 s of waiting.</text>
  <text class="note" x="48" y="1084">If COM1 fails to open, every write silently does nothing (tserial.cpp:162); the Sleep calls still run.</text>

  <!-- ============ legend ============ -->
  <rect class="b-blue" x="40" y="1126" width="14" height="14" rx="3"/>
  <text class="note" x="62" y="1138">absolute value</text>
  <rect class="b-gray" x="168" y="1126" width="14" height="14" rx="3"/>
  <text class="note" x="190" y="1138">remembered state</text>
  <rect class="b-orange" x="310" y="1126" width="14" height="14" rx="3"/>
  <text class="note" x="332" y="1138">motor E arithmetic</text>
  <rect class="b-purple" x="462" y="1126" width="14" height="14" rx="3"/>
  <text class="note" x="484" y="1138">motor D arithmetic</text>
  <rect class="b-red" x="614" y="1126" width="14" height="14" rx="3"/>
  <text class="note" x="636" y="1138">elbow correction</text>
  <rect class="b-green" x="752" y="1126" width="14" height="14" rx="3"/>
  <text class="note" x="774" y="1138">bytes sent</text>
  <rect class="b-planned" x="854" y="1126" width="14" height="14" rx="3"/>
  <text class="note" x="876" y="1138">waiting</text>

  <!-- ============ footnotes ============ -->
  <circle class="dot" cx="44" cy="1170" r="2.5"/>
  <text class="note" x="56" y="1174">Bare line numbers such as (:23) are lines of RhrinoSpecific.cpp.</text>
  <circle class="dot" cx="44" cy="1192" r="2.5"/>
  <text class="note" x="56" y="1196">Hypothetical first move: the 750 / 750 seed (90° / 0.12°) holds only until the first MoveToXY; afterwards the layer remembers 974 / 755 and −224.</text>
  <circle class="dot" cx="44" cy="1214" r="2.5"/>
  <text class="note" x="56" y="1218">In test5.txt the pen reaches (4, 12) on line 9: interpolation step 10 already sits at 974 / 756 clicks, so the final snap sends only "E-0" and "D+1".</text>
  <circle class="dot" cx="44" cy="1236" r="2.5"/>
  <text class="note" x="56" y="1240">Order is load-bearing: D subtracts whatever the last E call stored, and MoveToXY always calls E first (MoveToPoint.cpp:10–11).</text>
  <circle class="dot" cx="44" cy="1258" r="2.5"/>
  <text class="note" x="56" y="1262">The remainder write always happens, so a zero move still sends "E-0" and still sleeps 240 ms: the sign is '+' only when Distance &gt; 0.</text>
  <circle class="dot" cx="44" cy="1280" r="2.5"/>
  <text class="note" x="56" y="1284">Quill calls F-20 / F+20 (MoveToPoint.cpp:19, 25) match neither branch and go out unchanged; they leave TickAng1, TickAng2 and EmotorDistance alone.</text>
</svg>
